<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Master Unit - CMMS-BD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 180px;
            height: 100vh;
            background: #172033;
            color: white;
            padding: 25px 10px;
        }

        .logo {
            padding: 0 10px 20px;
            border-bottom: 1px solid #344056;
            margin-bottom: 15px;
        }

        .logo h2 {
            margin: 0;
            font-size: 17px;
        }

        .logo p {
            margin: 4px 0 0;
            font-size: 9px;
            color: #9ca3af;
        }

        .menu {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            margin-bottom: 5px;
            border-radius: 7px;
            font-size: 11px;
        }

        .menu:hover {
            background: #263957;
        }

        .menu.active {
            background: #263957;
        }

        .content {
            margin-left: 180px;
            padding: 25px 20px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 23px;
        }

        .page-title p {
            margin-top: 5px;
            color: #64748b;
            font-size: 12px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .card h2 {
            margin-top: 0;
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        label {
            display: block;
            font-size: 10px;
            margin-bottom: 6px;
            color: #475569;
        }

        input,
        select {
            width: 100%;
            padding: 8px 9px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .button-area {
            margin-top: 15px;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #f1f5f9;
            padding: 9px;
            font-size: 10px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 9px;
            font-size: 10px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .delete-btn {
            background: #dc2626;
            padding: 7px 12px;
            font-size: 10px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        @media (max-width: 1000px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">
            <h2>CMMS-BD</h2>
            <p>Maintenance Management System</p>
        </div>

        <a href="index.html" class="menu">
            📊 Dashboard
        </a>

        <a href="master-unit.html" class="menu active">
            🚜 Master Unit
        </a>

        <a href="breakdown.html" class="menu">
            🔧 Breakdown
        </a>

        <a href="#" class="menu">
            📅 Preventive Maintenance
        </a>

        <a href="#" class="menu">
            📈 Report
        </a>

    </div>


    <!-- CONTENT -->
    <div class="content">

        <div class="page-title">
            <h1>Master Unit</h1>
            <p>Data master unit CMMS-BD</p>
        </div>


        <!-- FORM -->
        <div class="card">

            <h2>Tambah Unit</h2>

            <div class="form-grid">

                <div>
                    <label>Type Unit</label>

                    <select id="typeUnit">

                        <option value="">Pilih Type Unit</option>

                        <option value="Excavator">
                            Excavator
                        </option>

                        <option value="Dump Truck">
                            Dump Truck
                        </option>

                        <option value="Dozer">
                            Dozer
                        </option>

                        <option value="Grader">
                            Grader
                        </option>

                        <option value="Wheel Loader">
                            Wheel Loader
                        </option>

                        <option value="Compactor">
                            Compactor
                        </option>

                        <option value="Crane">
                            Crane
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>
                </div>


                <div>
                    <label>Code Unit</label>

                    <input
                        type="text"
                        id="codeUnit"
                        placeholder="Contoh: EX 2003"
                    >
                </div>


                <div>
                    <label>Model</label>

                    <input
                        type="text"
                        id="model"
                        placeholder="Contoh: SH210-6"
                    >
                </div>


                <div>
                    <label>Serial Number</label>

                    <input
                        type="text"
                        id="serialNumber"
                        placeholder="Contoh: SH123456"
                    >
                </div>


                <div>
                    <label>Manufacture</label>

                    <input
                        type="text"
                        id="manufacture"
                        placeholder="Contoh: Sumitomo"
                    >
                </div>

            </div>


            <div class="button-area">

                <button onclick="addUnit()">
                    + Tambah Unit
                </button>

            </div>

        </div>


        <!-- TABLE -->
        <div class="card">

            <h2>Daftar Unit</h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>No</th>

                            <th>Type Unit</th>

                            <th>Code Unit</th>

                            <th>Model</th>

                            <th>Serial Number</th>

                            <th>Manufacture</th>

                            <th>Aksi</th>

                        </tr>

                    </thead>


                    <tbody id="unitTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


<script>

    let units =
        JSON.parse(
            localStorage.getItem("cmms_units")
        ) || [];


    function addUnit() {

        const typeUnit =
            document.getElementById("typeUnit").value.trim();

        const codeUnit =
            document.getElementById("codeUnit").value.trim();

        const model =
            document.getElementById("model").value.trim();

        const serialNumber =
            document.getElementById("serialNumber").value.trim();

        const manufacture =
            document.getElementById("manufacture").value.trim();


        if (
            !typeUnit ||
            !codeUnit ||
            !model ||
            !serialNumber ||
            !manufacture
        ) {

            alert("Semua data unit wajib diisi.");

            return;
        }


        // Cek Code Unit agar tidak duplikat
        const duplicate =
            units.some(
                unit =>
                    unit.codeUnit.toLowerCase() ===
                    codeUnit.toLowerCase()
            );


        if (duplicate) {

            alert("Code Unit sudah terdaftar.");

            return;
        }


        const newUnit = {

            id: Date.now(),

            typeUnit: typeUnit,

            codeUnit: codeUnit,

            model: model,

            serialNumber: serialNumber,

            manufacture: manufacture

        };


        units.push(newUnit);


        localStorage.setItem(
            "cmms_units",
            JSON.stringify(units)
        );


        clearForm();

        renderUnits();

    }


    function clearForm() {

        document.getElementById("typeUnit").value = "";

        document.getElementById("codeUnit").value = "";

        document.getElementById("model").value = "";

        document.getElementById("serialNumber").value = "";

        document.getElementById("manufacture").value = "";

    }


    function deleteUnit(id) {

        if (
            !confirm(
                "Apakah Anda yakin ingin menghapus unit ini?"
            )
        ) {

            return;

        }


        units =
            units.filter(
                unit => unit.id !== id
            );


        localStorage.setItem(
            "cmms_units",
            JSON.stringify(units)
        );


        renderUnits();

    }


    function renderUnits() {

        const table =
            document.getElementById("unitTable");


        table.innerHTML = "";


        if (units.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7">
                        Belum ada data unit.
                    </td>
                </tr>
            `;

            return;

        }


        units.forEach(
            (unit, index) => {

                table.innerHTML += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${unit.typeUnit}
                        </td>

                        <td>
                            ${unit.codeUnit}
                        </td>

                        <td>
                            ${unit.model}
                        </td>

                        <td>
                            ${unit.serialNumber}
                        </td>

                        <td>
                            ${unit.manufacture}
                        </td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteUnit(${unit.id})"
                            >
                                Hapus
                            </button>

                        </td>

                    </tr>

                `;

            }
        );

    }


    renderUnits();

</script>

</body>
</html>
