<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Unit - CMMS BD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #1f2937;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #172033;
            color: white;
            padding: 22px 15px;
        }

        .logo {
            padding: 10px 12px 25px;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        .logo h2 {
            font-size: 22px;
        }

        .logo p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 7px;
        }

        .menu button {
            width: 100%;
            border: none;
            background: transparent;
            color: #cbd5e1;
            text-align: left;
            padding: 13px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu button:hover,
        .menu button.active {
            background: #263653;
            color: white;
        }

        .content {
            flex: 1;
            padding: 28px;
            overflow-x: auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            color: #64748b;
            margin-top: 5px;
        }

        .form-box,
        .table-box {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-box h2,
        .table-box h2 {
            font-size: 19px;
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field label {
            font-size: 13px;
            color: #475569;
        }

        .field input,
        .field select {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
        }

        .field input:focus,
        .field select:focus {
            border-color: #2563eb;
        }

        .button-row {
            margin-top: 18px;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }

        th {
            background: #f8fafc;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .empty {
            color: #64748b;
            padding: 25px;
        }

        @media (max-width: 900px) {
            .form-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .sidebar {
                width: 190px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <h2>CMMS-BD</h2>
            <p>Maintenance Management System</p>
        </div>

        <ul class="menu">

            <li>
                <button onclick="location.href='index.html'">
                    📊 Dashboard
                </button>
            </li>

            <li>
                <button class="active">
                    🚜 Master Unit
                </button>
            </li>

            <li>
                <button onclick="location.href='breakdown.html'">
                    🔧 Breakdown
                </button>
            </li>

            <li>
                <button>
                    📋 Preventive Maintenance
                </button>
            </li>

            <li>
                <button>
                    📈 Report
                </button>
            </li>

        </ul>

    </aside>


    <!-- CONTENT -->
    <main class="content">

        <div class="header">
            <h1>Master Unit</h1>
            <p>Data master unit CMMS-BD</p>
        </div>


        <!-- FORM TAMBAH UNIT -->
        <div class="form-box">

            <h2>Tambah Unit</h2>

            <div class="form-row">

                <div class="field">
                    <label>Unit No</label>

                    <input
                        type="text"
                        id="unitNo"
                        placeholder="Contoh: EX2003"
                    >
                </div>


                <div class="field">
                    <label>Model</label>

                    <input
                        type="text"
                        id="model"
                        placeholder="Contoh: EX2000"
                    >
                </div>


                <div class="field">
                    <label>Type BD</label>

                    <select id="typeBD">

                        <option value="">
                            Pilih Type BD
                        </option>

                        <option value="Breakdown Schedule">
                            Breakdown Schedule
                        </option>

                        <option value="Unschedule">
                            Unschedule
                        </option>

                    </select>

                </div>


                <div class="field">
                    <label>Status</label>

                    <select id="status">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>


            <div class="button-row">

                <button class="btn" onclick="addUnit()">
                    + Tambah Unit
                </button>

            </div>

        </div>


        <!-- TABEL UNIT -->
        <div class="table-box">

            <h2>Daftar Unit</h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>No</th>
                            <th>Unit No</th>
                            <th>Model</th>
                            <th>Type BD</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>

                    </thead>

                    <tbody id="unitTable">

                        <tr>
                            <td colspan="6" class="empty">
                                Belum ada data unit
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

    /*
     * DATA MASTER UNIT
     *
     * Data disimpan di localStorage browser.
     * Jadi data tidak hilang ketika halaman
     * direfresh atau ditutup.
     */

    let units =
        JSON.parse(
            localStorage.getItem("cmms_units")
        ) || [];


    /*
     * TAMBAH UNIT
     */

    function addUnit() {

        const unitNo =
            document
                .getElementById("unitNo")
                .value
                .trim();

        const model =
            document
                .getElementById("model")
                .value
                .trim();

        const typeBD =
            document
                .getElementById("typeBD")
                .value;

        const status =
            document
                .getElementById("status")
                .value;


        /*
         * VALIDASI
         */

        if (
            !unitNo ||
            !model ||
            !typeBD
        ) {

            alert(
                "Unit No, Model, dan Type BD wajib diisi."
            );

            return;
        }


        /*
         * CEK UNIT DUPLIKAT
         */

        const existing =
            units.some(
                unit =>
                    unit.unitNo.toLowerCase()
                    ===
                    unitNo.toLowerCase()
            );


        if (existing) {

            alert(
                "Unit No sudah terdaftar."
            );

            return;
        }


        /*
         * MASUKKAN DATA
         */

        units.push({

            unitNo: unitNo,

            model: model,

            typeBD: typeBD,

            status: status

        });


        /*
         * SIMPAN KE LOCAL STORAGE
         */

        localStorage.setItem(
            "cmms_units",
            JSON.stringify(units)
        );


        /*
         * TAMPILKAN DATA
         */

        renderUnits();


        /*
         * KOSONGKAN FORM
         */

        document
            .getElementById("unitNo")
            .value = "";

        document
            .getElementById("model")
            .value = "";

        document
            .getElementById("typeBD")
            .value = "";

        document
            .getElementById("status")
            .value = "Active";

    }


    /*
     * HAPUS UNIT
     */

    function deleteUnit(index) {

        if (
            confirm(
                "Yakin ingin menghapus unit ini?"
            )
        ) {

            units.splice(
                index,
                1
            );


            /*
             * UPDATE LOCAL STORAGE
             */

            localStorage.setItem(
                "cmms_units",
                JSON.stringify(units)
            );


            renderUnits();

        }

    }


    /*
     * TAMPILKAN DATA UNIT
     */

    function renderUnits() {

        const table =
            document.getElementById(
                "unitTable"
            );


        /*
         * JIKA BELUM ADA DATA
         */

        if (
            units.length === 0
        ) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="empty"
                    >
                        Belum ada data unit
                    </td>
                </tr>
            `;

            return;
        }


        /*
         * KOSONGKAN TABEL
         */

        table.innerHTML = "";


        /*
         * TAMPILKAN SEMUA UNIT
         */

        units.forEach(
            (unit, index) => {

                table.innerHTML += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${unit.unitNo}
                        </td>

                        <td>
                            ${unit.model}
                        </td>

                        <td>
                            ${unit.typeBD}
                        </td>

                        <td>
                            ${unit.status}
                        </td>

                        <td>

                            <button
                                class="btn btn-danger"
                                onclick="deleteUnit(${index})"
                            >
                                Hapus
                            </button>

                        </td>

                    </tr>

                `;

            }
        );

    }


    /*
     * TAMPILKAN DATA SAAT HALAMAN DIBUKA
     */

    renderUnits();

</script>

</body>
</html>
