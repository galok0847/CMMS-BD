<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakdown - CMMS BD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            background: #f4f6f8;
            color: #333;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .logo p {
            font-size: 12px;
            color: #9ca3af;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: block;
            padding: 12px 15px;
            color: #d1d5db;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
        }

        .menu a:hover {
            background: #374151;
            color: white;
        }

        .menu a.active {
            background: #2563eb;
            color: white;
        }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 30px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            color: #111827;
        }

        .header p {
            margin-top: 5px;
            color: #6b7280;
        }

        /* FORM */
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #111827;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .full {
            grid-column: span 3;
        }

        .button-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        /* TABLE */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1300px;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }

        tr:hover {
            background: #f9fafb;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
            padding: 6px 10px;
            font-size: 12px;
            margin-left: 5px;
        }

        .status-open {
            color: #dc2626;
            font-weight: bold;
        }

        .status-closed {
            color: #16a34a;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 190px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <h2>CMMS BD</h2>
            <p>Maintenance System</p>
        </div>

        <ul class="menu">

            <li>
                <a href="index.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="master-unit.html">
                    Master Unit
                </a>
            </li>

            <li>
                <a href="breakdown.html" class="active">
                    Breakdown
                </a>
            </li>

        </ul>

    </aside>


    <!-- CONTENT -->
    <main class="content">

        <div class="header">
            <h1>Breakdown</h1>
            <p>Input dan monitoring data breakdown unit</p>
        </div>


        <!-- FORM INPUT -->
        <div class="card">

            <h2>Input Breakdown</h2>

            <form id="breakdownForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="date" id="tanggal" required>
                    </div>


                    <div class="form-group">
                        <label>Unit No</label>

                        <select id="unitNo" required>
                            <option value="">-- Pilih Unit --</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Model</label>

                        <input
                            type="text"
                            id="model"
                            readonly
                            placeholder="Otomatis"
                        >
                    </div>


                    <div class="form-group">
                        <label>Type BD</label>

                        <input
                            type="text"
                            id="typeBD"
                            readonly
                            placeholder="Otomatis"
                        >
                    </div>


                    <div class="form-group">
                        <label>Component</label>

                        <input
                            type="text"
                            id="component"
                            placeholder="Contoh: Engine"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Status</label>

                        <select id="status" required>
                            <option value="Open">Open</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Downtime (Jam)</label>

                        <input
                            type="number"
                            id="downtime"
                            min="0"
                            step="0.01"
                            placeholder="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Operating Hours (Jam)</label>

                        <input
                            type="number"
                            id="operatingHours"
                            min="0"
                            step="0.01"
                            placeholder="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>HM Awal</label>

                        <input
                            type="number"
                            id="hmAwal"
                            min="0"
                            step="0.01"
                            placeholder="0"
                        >
                    </div>


                    <div class="form-group">
                        <label>HM Akhir</label>

                        <input
                            type="number"
                            id="hmAkhir"
                            min="0"
                            step="0.01"
                            placeholder="0"
                        >
                    </div>


                    <div class="form-group full">

                        <label>Problem</label>

                        <textarea
                            id="problem"
                            placeholder="Jelaskan problem breakdown"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group full">

                        <label>Keterangan</label>

                        <textarea
                            id="keterangan"
                            placeholder="Keterangan tambahan"
                        ></textarea>

                    </div>

                </div>


                <div class="button-area">

                    <button
                        type="submit"
                        class="btn-primary"
                        id="btnSimpan"
                    >
                        Simpan Breakdown
                    </button>

                    <button
                        type="button"
                        class="btn-secondary"
                        onclick="resetForm()"
                    >
                        Reset
                    </button>

                </div>

            </form>

        </div>


        <!-- TABLE DATA -->
        <div class="card">

            <h2>Data Breakdown</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>No</th>
                            <th>Tanggal</th>
                            <th>Unit No</th>
                            <th>Model</th>
                            <th>Type BD</th>
                            <th>Component</th>
                            <th>Problem</th>
                            <th>Downtime</th>
                            <th>Operating Hours</th>
                            <th>HM Awal</th>
                            <th>HM Akhir</th>
                            <th>Status</th>
                            <th>Keterangan</th>
                            <th>Aksi</th>
                        </tr>

                    </thead>

                    <tbody id="breakdownTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script>

        /*
        =====================================================
        MASTER UNIT
        =====================================================
        */

        let units =
            JSON.parse(
                localStorage.getItem("cmms_units")
            ) || [];


        /*
        =====================================================
        DATA BREAKDOWN
        =====================================================
        */

        let breakdowns =
            JSON.parse(
                localStorage.getItem("cmms_breakdowns")
            ) || [];


        /*
        =====================================================
        EDIT MODE
        =====================================================
        */

        let editIndex = -1;


        /*
        =====================================================
        LOAD UNIT KE DROPDOWN
        =====================================================
        */

        function loadUnits() {

            const unitSelect =
                document.getElementById("unitNo");

            unitSelect.innerHTML =
                '<option value="">-- Pilih Unit --</option>';


            units.forEach(function(unit) {

                const option =
                    document.createElement("option");

                option.value = unit.unitNo;

                option.textContent =
                    unit.unitNo;

                unitSelect.appendChild(option);

            });

        }


        /*
        =====================================================
        UNIT DIPILIH
        MODEL DAN TYPE BD OTOMATIS
        =====================================================
        */

        document
            .getElementById("unitNo")
            .addEventListener("change", function() {

                const selectedUnit =
                    this.value;

                const unit =
                    units.find(function(item) {

                        return item.unitNo === selectedUnit;

                    });


                if (unit) {

                    document.getElementById("model").value =
                        unit.model || "";

                    document.getElementById("typeBD").value =
                        unit.typeBD || "";

                } else {

                    document.getElementById("model").value =
                        "";

                    document.getElementById("typeBD").value =
                        "";

                }

            });


        /*
        =====================================================
        SIMPAN DATA
        =====================================================
        */

        document
            .getElementById("breakdownForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const tanggal =
                    document.getElementById("tanggal").value;

                const unitNo =
                    document.getElementById("unitNo").value;

                const model =
                    document.getElementById("model").value;

                const typeBD =
                    document.getElementById("typeBD").value;

                const component =
                    document.getElementById("component").value.trim();

                const problem =
                    document.getElementById("problem").value.trim();

                const downtime =
                    Number(
                        document.getElementById("downtime").value
                    );

                const operatingHours =
                    Number(
                        document.getElementById("operatingHours").value
                    );

                const hmAwal =
                    Number(
                        document.getElementById("hmAwal").value || 0
                    );

                const hmAkhir =
                    Number(
                        document.getElementById("hmAkhir").value || 0
                    );

                const status =
                    document.getElementById("status").value;

                const keterangan =
                    document
                        .getElementById("keterangan")
                        .value
                        .trim();


                /*
                VALIDASI
                */

                if (!tanggal ||
                    !unitNo ||
                    !model ||
                    !typeBD ||
                    !component ||
                    !problem) {

                    alert(
                        "Mohon lengkapi data yang wajib diisi."
                    );

                    return;

                }


                if (downtime < 0) {

                    alert(
                        "Downtime tidak boleh negatif."
                    );

                    return;

                }


                if (operatingHours < 0) {

                    alert(
                        "Operating Hours tidak boleh negatif."
                    );

                    return;

                }


                if (hmAkhir < hmAwal) {

                    alert(
                        "HM Akhir tidak boleh lebih kecil dari HM Awal."
                    );

                    return;

                }


                /*
                OBJECT DATA
                */

                const data = {

                    tanggal: tanggal,

                    unitNo: unitNo,

                    model: model,

                    typeBD: typeBD,

                    component: component,

                    problem: problem,

                    downtime: downtime,

                    operatingHours: operatingHours,

                    hmAwal: hmAwal,

                    hmAkhir: hmAkhir,

                    status: status,

                    keterangan: keterangan

                };


                /*
                JIKA EDIT
                */

                if (editIndex !== -1) {

                    breakdowns[editIndex] = data;

                    editIndex = -1;

                    document.getElementById(
                        "btnSimpan"
                    ).textContent =
                        "Simpan Breakdown";

                }


                /*
                JIKA DATA BARU
                */

                else {

                    breakdowns.push(data);

                }


                /*
                SIMPAN LOCAL STORAGE
                */

                localStorage.setItem(
                    "cmms_breakdowns",
                    JSON.stringify(breakdowns)
                );


                /*
                REFRESH TABLE
                */

                renderBreakdowns();


                /*
                RESET FORM
                */

                resetForm();


                alert(
                    "Data breakdown berhasil disimpan."
                );

            });


        /*
        =====================================================
        TAMPILKAN DATA
        =====================================================
        */

        function renderBreakdowns() {

            const tbody =
                document.getElementById(
                    "breakdownTableBody"
                );


            tbody.innerHTML = "";


            if (breakdowns.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="14"
                            style="text-align:center; padding:20px;">
                            Belum ada data breakdown
                        </td>
                    </tr>
                `;

                return;

            }


            breakdowns.forEach(function(data, index) {

                const row =
                    document.createElement("tr");


                const statusClass =
                    data.status === "Closed"
                        ? "status-closed"
                        : "status-open";


                row.innerHTML = `

                    <td>${index + 1}</td>

                    <td>${data.tanggal}</td>

                    <td>${data.unitNo}</td>

                    <td>${data.model}</td>

                    <td>${data.typeBD}</td>

                    <td>${data.component}</td>

                    <td>${data.problem}</td>

                    <td>${data.downtime}</td>

                    <td>${data.operatingHours}</td>

                    <td>${data.hmAwal}</td>

                    <td>${data.hmAkhir}</td>

                    <td class="${statusClass}">
                        ${data.status}
                    </td>

                    <td>${data.keterangan || "-"}</td>

                    <td>

                        <button
                            class="btn-edit"
                            onclick="editBreakdown(${index})"
                        >
                            Edit
                        </button>

                        <button
                            class="btn-delete"
                            onclick="deleteBreakdown(${index})"
                        >
                            Hapus
                        </button>

                    </td>

                `;


                tbody.appendChild(row);

            });

        }


        /*
        =====================================================
        EDIT DATA
        =====================================================
        */

        function editBreakdown(index) {

            const data =
                breakdowns[index];


            document.getElementById("tanggal").value =
                data.tanggal;

            document.getElementById("unitNo").value =
                data.unitNo;


            document.getElementById("model").value =
                data.model;

            document.getElementById("typeBD").value =
                data.typeBD;

            document.getElementById("component").value =
                data.component;

            document.getElementById("problem").value =
                data.problem;

            document.getElementById("downtime").value =
                data.downtime;

            document.getElementById("operatingHours").value =
                data.operatingHours;

            document.getElementById("hmAwal").value =
                data.hmAwal;

            document.getElementById("hmAkhir").value =
                data.hmAkhir;

            document.getElementById("status").value =
                data.status;

            document.getElementById("keterangan").value =
                data.keterangan;


            editIndex = index;


            document.getElementById(
                "btnSimpan"
            ).textContent =
                "Update Breakdown";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /*
        =====================================================
        HAPUS DATA
        =====================================================
        */

        function deleteBreakdown(index) {

            const yakin =
                confirm(
                    "Apakah Anda yakin ingin menghapus data ini?"
                );


            if (!yakin) {
                return;
            }


            breakdowns.splice(index, 1);


            localStorage.setItem(
                "cmms_breakdowns",
                JSON.stringify(breakdowns)
            );


            renderBreakdowns();

        }


        /*
        =====================================================
        RESET FORM
        =====================================================
        */

        function resetForm() {

            document
                .getElementById("breakdownForm")
                .reset();


            document.getElementById("model").value =
                "";

            document.getElementById("typeBD").value =
                "";


            editIndex = -1;


            document.getElementById(
                "btnSimpan"
            ).textContent =
                "Simpan Breakdown";

        }


        /*
        =====================================================
        LOAD SAAT HALAMAN DIBUKA
        =====================================================
        */

        loadUnits();

        renderBreakdowns();

    </script>

</body>
</html>
